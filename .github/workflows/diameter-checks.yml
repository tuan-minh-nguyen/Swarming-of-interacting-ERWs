name: Diameter proof checks

on:
  push:
    branches: [diameter-proof-development]

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install Lean 4.33.1
        run: |
          curl -fsSLo "$RUNNER_TEMP/lean.tar.zst" 'https://github.com/leanprover/lean4/releases/download/v4.33.1/lean-4.33.1-linux.tar.zst'
          printf '%s  %s\n' '890afd185370f85666025b883914ab4f4b339136f8c96167b69cfb62aecaf235' "$RUNNER_TEMP/lean.tar.zst" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/lean"
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" --strip-components=1 -C "$RUNNER_TEMP/lean"
          echo "$RUNNER_TEMP/lean/bin" >> "$GITHUB_PATH"
      - name: Check the source inventory and approved statements
        run: |
          python3 scripts/check_sources.py
          python3 -m unittest discover -s tests
          python3 scripts/check_diameter_statement.py
      - name: Fetch pinned dependency artifacts
        run: |
          lake exe cache get $(awk '/^import Mathlib\./ {print $2}' Swarm/Imports.lean Swarm/Swarming.lean SwarmDiameter/*.lean | sort -u)
      - name: Replay renewal and occupation proofs
        run: bash scripts/verify_diameter_support.sh
      - name: Elaborate the diameter definitions
        run: |
          output="$RUNNER_TEMP/diameter-model"
          mkdir -p "$output/Swarm"
          export LEAN_PATH="$output:$(lake env printenv LEAN_PATH)"
          for module in Imports Swarming LocalTime UniformArray Trajectory LeaderDescent; do
            lean -j1 -o "$output/Swarm/$module.olean" "Swarm/$module.lean"
          done
          lean -j1 SwarmDiameter/PathDiameter.lean

  swarm:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    concurrency:
      group: diameter-swarm-build
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install Lean 4.33.1
        run: |
          curl -fsSLo "$RUNNER_TEMP/lean.tar.zst" 'https://github.com/leanprover/lean4/releases/download/v4.33.1/lean-4.33.1-linux.tar.zst'
          printf '%s  %s\n' '890afd185370f85666025b883914ab4f4b339136f8c96167b69cfb62aecaf235' "$RUNNER_TEMP/lean.tar.zst" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/lean"
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" --strip-components=1 -C "$RUNNER_TEMP/lean"
          echo "$RUNNER_TEMP/lean/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned dependency artifacts
        run: |
          mapfile -t mathlib < <(python3 - <<'PYTHON'
          from pathlib import Path
          import sys
          sys.path.insert(0, "scripts")
          from lean_sources import imports
          paths = [*Path("Swarm").rglob("*.lean"), *Path("SwarmDiameter").glob("*.lean")]
          print("\n".join(sorted({m for p in paths for m in imports(p.read_text()) if m.startswith("Mathlib.")})))
          PYTHON
          )
          test "${#mathlib[@]}" -gt 0
          lake exe cache get "${mathlib[@]}"
      - name: Pin the configuration for the existing Swarm build
        run: |
          cp lakefile.lean "$RUNNER_TEMP/diameter-lakefile.lean"
          python3 - <<'PYTHON'
          from pathlib import Path
          path = Path("lakefile.lean")
          current = path.read_text(encoding="utf-8")
          expected = "import Lake\nopen Lake DSL\n\npackage swarming\n\nrequire mathlib from git\n  \"https://github.com/leanprover-community/mathlib4.git\" @ \"0df444a360eaa60ab8c11dca51a86af692955474\"\n\n@[default_target]\nlean_lib Swarm\n\nlean_lib SwarmDiameter where\n  roots := #[`SwarmDiameter, `SwarmDiameter.RenewalProcess, `SwarmDiameter.RegenerationBlocks,\n    `SwarmDiameter.FirstIntervalOccupation]\n"
          if current != expected:
              raise SystemExit("Unexpected Lake configuration for the existing Swarm build")
          path.write_text("import Lake\nopen Lake DSL\n\npackage swarming\n\nrequire mathlib from git\n  \"https://github.com/leanprover-community/mathlib4.git\" @ \"0df444a360eaa60ab8c11dca51a86af692955474\"\n\n@[default_target]\nlean_lib Swarm\n\nlean_lib SwarmDiameter where\n  roots := #[`SwarmDiameter.RenewalProcess, `SwarmDiameter.RegenerationBlocks,\n    `SwarmDiameter.FirstInterval]\n", encoding="utf-8")
          PYTHON
      - name: Restore compiled swarm modules
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: .scratch/diameter-swarm
          key: diameter-swarm-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Swarm.lean', 'Swarm/**/*.lean', 'lake-manifest.json', 'lean-toolchain', 'lakefile.lean', 'scripts/build.py') }}
      - name: Build the existing swarm proof
        run: |
          work=.scratch/diameter-swarm
          resume=()
          if test -f "$work/summary.json"; then resume=(--resume); fi
          python3 scripts/build.py --work "$work" --jobs 2 "${resume[@]}"
      - name: Replay and audit the diameter theorem
        run: |
          mv "$RUNNER_TEMP/diameter-lakefile.lean" lakefile.lean
          export LEAN_PATH="$(cat .scratch/diameter-swarm/lean-path.txt)"
          build=.scratch/diameter-swarm/lib/SwarmDiameter
          mkdir -p "$build"
          for module in ArithmeticRenewal CycleOccupation DelayedRenewal FirstInterval \
                        FirstIntervalOccupation RenewalProcess RegenerationBlocks PathDiameter \
                        RegenerationProbability SwarmRenewal LinearTrial \
                        BinomialEndpoint ReflectionExcursion SymmetricConfinement TrialBounds \
                        SymmetricTrial TwoWalkerTrial RecordDensity TailBounds MaxGrowth \
                        LeadingWalkTrial CubicTrial SwarmLowerBounds RecordIntervals \
                        RecordOccupation RecordOccupationBound SwarmUpperGrowth \
                        DyadicTail RecordExceedance SpatialGapSums TruncatedPowerTail \
                        MarkedGapPattern GeometricGapTail MarkedSpatialTail OccupationTail \
                        ProjectedPotentialOscillation RecordTrialConcentration \
                        RecordOccupationMartingale SeparatedGroupStep RecordGroupDrift \
                        RecordGroupAdvance RecordGroupPotential RecordGroupMaximum \
                        RecordGroupMovement RecordOccupationEstimate RecordOccupationHighProbability \
                        RecordLocalClauses RecordFluidLimit RecordHalving RecordCubicBlock RecordTailFromBlock \
                        SwarmDiameterBounds SwarmDiameterCubic RecordDownwardCrossing RecordMartingaleAtOffset \
                        RecordExitTime TwoWalkerPassage TwoWalkerGap TwoWalkerMeeting TwoWalkerBlock \
                        TwoWalkerTail SwarmDiameterTwoWalker SoftMinimum MinimumProgress BoundedPotential \
                        MarkBlockConcentration BoundedSlopeWindow BoundedSpatial RecordBoundedSpatial \
                        RecordWeightedMartingale MinimumOccupationTest SparseSets RecordMinimumOccupation \
                        BoundedGroupComparison BoundedGroupStep BoundedGroupMean BoundedGroupMeasurable \
                        FluidLeaderPersistence LinearCutoff LinearBlockGeometry RecordBoundedGroup \
                        RecordSpatialConcentration RecordLinearTrialCount RecordLinearClauses \
                        RecordLinearConcentration LinearRecordFluid LinearRecordHalving RecordLinearBlock \
                        SwarmDiameterLinear Main; do
            lean -j1 -o "$build/$module.olean" "SwarmDiameter/$module.lean"
          done
          lean -j1 -o "$build/../SwarmDiameter.olean" SwarmDiameter.lean
          lean -j1 -t0 audit/SwarmRenewal.lean
