name: Remove superseded development branches

on:
  push:
    branches: [main]
    paths: [.github/workflows/cleanup-obsolete-branches.yml]

permissions:
  contents: write

jobs:
  remove-old-branches:
    runs-on: ubuntu-24.04
    steps:
      - name: Delete only unchanged superseded branches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for entry in \
            'diameter-proof-development:e44b8308e042a3c19e69bca4a7f266b5d44d08a3' \
            'diameter-formalization:a2d83f6236130b2e05ed7c7b2ed558f8818e1181'; do
            branch="${entry%%:*}"
            expected="${entry#*:}"
            actual="$(gh api "repos/$GH_REPO/git/ref/heads/$branch" --jq '.object.sha')"
            if [[ "$actual" != "$expected" ]]; then
              echo "Branch $branch changed: expected $expected, got $actual" >&2
              exit 1
            fi
            gh api -X DELETE "repos/$GH_REPO/git/refs/heads/$branch"
            echo "Removed $branch"
          done
